name: Classical optics numerical tests
on:
  push:
    paths:
      - 'organic_dispersion.py'
      - 'validation_comparisons_v2.py'
      - 'material_csv.py'
      - 'multilayer.py'
      - 'scientific_diagnostics.py'
      - 'engine.py'
      - 'optical_inversion_package/**'
      - 'tests/**'
      - 'examples/v2/**'
      - '.github/workflows/classical-optics-tests.yml'
  workflow_dispatch:
jobs:
  numerical-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pytest
      - run: python -m unittest discover -s tests -p 'test_material_csv.py' -v
      - run: python -m unittest discover -s tests -p 'test_multilayer.py' -v
      - run: python -m unittest discover -s tests -p 'test_lorentz_forward.py' -v
      - run: python examples/v2/generate_tauc_lorentz.py
      - run: python -m pytest -q tests/test_v2_examples.py tests/test_tauc_lorentz_v2.py tests/test_v2_substrate_dispersion.py tests/test_v2_validation_comparisons.py tests/test_v2_tl_inverse_recovery.py
