name: Optical inversion regression tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  numerical-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Multilayer forward validation
        run: python -m pytest tests/test_multilayer_forward.py -q
