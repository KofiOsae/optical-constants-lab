name: Nanoparticle optics independent validation
on:
  push:
    branches:
      - research/nanoparticle-optics-ema
    paths:
      - 'nanoparticle_optics/**'
      - 'tests/test_nanoparticle_*.py'
      - '.github/workflows/nanoparticle-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scientific-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical test dependencies
        run: python -m pip install numpy scipy pytest
      - name: Run independent nanoparticle unit tests
        run: python -m pytest -q tests/test_nanoparticle_effective_medium.py tests/test_nanoparticle_mie.py
