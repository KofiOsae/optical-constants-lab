name: Nanoparticle optics independent validation
on:
  push:
    branches:
      - research/nanoparticle-optics-ema
    paths:
      - 'nanoparticle_optics/**'
      - 'tests/test_nanoparticle_*.py'
      - '.github/workflows/nanoparticle-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scientific-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical test dependencies
        run: python -m pip install numpy scipy pytest flask
      - name: Run independent nanoparticle unit tests
        run: python -m pytest -q tests/test_nanoparticle_effective_medium.py tests/test_nanoparticle_mie.py tests/test_nanoparticle_ensemble.py tests/test_nanoparticle_scientific_benchmarks.py tests/test_nanoparticle_materials.py tests/test_nanoparticle_ellipsometry.py tests/test_nanoparticle_meep2d.py tests/test_nanoparticle_fmm.py tests/test_nanoparticle_distributions.py tests/test_nanoparticle_angular.py tests/test_nanoparticle_phase_function.py tests/test_nanoparticle_ellipsometry_csv.py tests/test_nanoparticle_preview_routes.py tests/test_nanoparticle_effective_epsilon_api.py tests/test_nanoparticle_optical_csv.py tests/test_nanoparticle_film_tmm.py tests/test_nanoparticle_meep_colab.py tests/test_nanoparticle_dispersion_models.py tests/test_nanoparticle_four_fill_factors.py tests/test_nanoparticle_angular_api.py
